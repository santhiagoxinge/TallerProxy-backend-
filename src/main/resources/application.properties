spring.application.name=monitoring
server.port=${PORT:8080}

# PostgreSQL (Supabase). Example URL: jdbc:postgresql://<host>:5432/postgres?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Comma-separated list of origins allowed to call the API (use the frontend URL in production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Share of PaymentService calls that fail on purpose
app.payment.failure-rate=${PAYMENT_FAILURE_RATE:0.10}
